name: Backend Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GROQ_API_KEY: ""
      MISTRAL_API_KEY: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r backend/requirements.txt

      - name: Run pytest
        run: |
          PYTHONPATH=backend uv run pytest backend/tests/ -v --tb=short