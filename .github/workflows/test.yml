name: Backend Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GROQ_API_KEY: "mock-groq-key-for-tests"
      MISTRAL_API_KEY: "mock-mistral-key-for-tests"
      TWILIO_ACCOUNT_SID: "ACmockaccountidsidforci"
      TWILIO_AUTH_TOKEN: "mockauthtokenforci"
      DATABASE_URL: "sqlite:///./test.db"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r backend/requirements.txt

      - name: Run pytest
        run: |
          source .venv/bin/activate
          PYTHONPATH=backend pytest backend/tests/ -v --tb=short